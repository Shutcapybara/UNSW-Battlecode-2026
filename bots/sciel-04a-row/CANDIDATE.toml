mechanism = "Right-of-way contact deconfliction (movement-level, stacks on the 03c EW mechanism): in the OK-move scoring, a candidate landing adjacent to a LOWER-id ally head that is within row_contact=3 of us costs row_cost=2.5. The id asymmetry makes exactly one of a converging pair yield -- the symmetric crowd_weight lets both dodge into each other or neither. Target: the h2h_ally head-on class that blocked the EW economy family (+34/31/38 percent across 03a/b/c)."
expected_change = "death_h2h_ally_per1k within +10 percent of base 2.41 while keeping 03c's econ~ (+0.105 pool / +16.3 percent gen) and its pearls pairs; attribution read is 04a vs 03c (isolates right-of-way), gate read is 04a vs sciel-00-base. Risk: row_cost over-triggers in dense swarms (schooltime) and the economy gain halves, or the asymmetry just moves collisions to higher-id dragons (rate unchanged)."
hypothesis = "H2's arrival-time diagnosis: h2h_ally deaths happen between dragons in contact whose yielding is uncoordinated. A deterministic id-ordered yield removes the coordination problem at the movement layer without touching valuation or radio."
