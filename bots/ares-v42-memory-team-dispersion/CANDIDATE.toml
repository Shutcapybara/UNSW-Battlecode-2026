hypothesis = "Portal-split dragons can waste exploration effort revisiting partly remembered sectors without pearl beds and moving toward teammate heads, even after the immediate portal-return preference is reduced."
mechanism = "Remove the Devil lane movement bonus; discount unseen exploration cells in sufficiently remembered sectors with no known pearl beds, use the same discount for fallback sector targets, and apply a bounded action cost when a visible teammate head gets closer."
expected_change = "Exploring dragons should spread into less explored or pearl-bed sectors and avoid converging on visible teammates, while existing resource collection and hunt scoring remain available."
