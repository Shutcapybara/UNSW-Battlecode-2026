hypothesis = "Restricting the five-step reach score to dragons with at most eight reachable cells will reduce deaths in critically tight pockets while avoiding V15's broad economy loss."
mechanism = "Use V15's same post-move reach delta and score weight, but apply it only when the dragon's current body-blocked reach is at most eight cells. No score adjustment applies while current reach is above eight."
