summary = "Match 674727 records V35 dragon 1 approaching the unpaired Queen of Spades portal edge at (6,17), then turning north on round 52. Its prior pearl was eaten at round 33 and cleared from local memory; its next pearl is round 86. V36 increases the no-fresh-pearl portal target value to 8 (unseen ground is 5), keeps fresh pearl and bed values, and waits until dragon age 3. Seed-1 sandbox live10 screen: 13-7 vs V35 and 9-11 vs V19 with zero runner errors; the full-match screen does not replay-drive the saved turn. The API lists submission v91 (ID 12728) as active; locally V36 remains experimental and the portal value is being narrowed."
