hypothesis = "Heartbreaker splits on 99.9 % of turns with no free ordinary exit and no portal (wrapper W1); Ares escape-splits only when every scored path is already dead and the child has an exit. Porting W1 converts trapped deaths into kept material (ledger L24/L05)."
mechanism = "One switch on a verbatim V06 copy (Params::hb1_escape_split): no free ordinary forward/right/left step and no portal among them, split legal -> SPLIT length-2 (Ares escape size), overriding move scoring."
expected_change = "Fewer trapped/wall deaths and more dragons alive; economy gate not falling; activation on trapped turns only."
