hypothesis = "Spending the chassis' spare CPU on per-dragon arrival maps, bed valuation against enemy arrival, spaced assignment and patrol timing converts into pearls and length by r100 on the live pool and on unseen maps."
mechanism = "router.hpp on anna-a02-chassis: own/enemy/ally BFS arrival maps; bed value = pearls eaten before the enemy's earliest arrival (observed gaps, later ripenings down-weighted); greedy assignment with 3-cell spacing + pair swap + hysteresis; patrol timing; dead-end trees (2-core peel) with a feeding rule; pearl-gated 2+2 splits needing a child target; big-child split when trapped; known-exit portals as routes. Horizons and caps keyed on tile count; atlas switch CX_ATLAS."
expected_change = "vs anna-a02-chassis in exact pairs: len_r100 up on the live pool and on the var/new panel; eaten_r100 up on the live pool; units_r100 flat; newborn and wall deaths up on the live pool (mill maps). vs yuna-v03 (545's lineage): behind on units and on the panel — not expected to pass the dev screen as is."
