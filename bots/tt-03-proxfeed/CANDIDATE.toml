name = "tt-03-proxfeed"
lineage = "tt"
author = "claude/tt"
language = "c++"
lineage_parent = "hb1-14-prior-r540"
hypothesis = "Fixed-round earlier feeding (tt-01/tt-02) dissolves the swarm at once and gives up elimination wins. Stockfish converts gradually: from r250 a small dragon next to an ally head kills itself at ~3 % per turn (1.2 % at distance 2). A slow proximity feed grows the longest dragon while the swarm keeps its elimination pressure."
mechanism = "One block vs hb1-14 (uploadable Ares + Heartbreaker direction prior): from r250, length <= 3, not the crown, a strictly longer ally head adjacent -> self-kill with p = 0.03 per turn (distance 2: 0.012), via the feeder's own fatal-move routine. Rates and start round are Stockfish's measured values, fixed before screening. Crown/feeder logic unchanged."
expected_change = "Longer longest dragon at r400/r490 and fewer round-limit losses with a material lead, without the loss of elimination wins seen in tt-01/tt-02."
priority = 0
supersedes = ""

