summary = "V38 lost a ten-map seed-1 V37 comparison 7–13 and used length-3 dashes on 3.9% of length-3 turns versus V37's 1.1%. V39 reduces the 4.0 reimbursement to 2.5 and stops reimbursing escape-plan arrivals, but also lost 7–13 to V37."
