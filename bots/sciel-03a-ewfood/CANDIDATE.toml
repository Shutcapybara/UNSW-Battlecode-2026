mechanism = "EW food-density memory (S-1 ten-day plan, H9 cheap variant): food_ew[c] += 1.0 per pearl eaten on c (commit_move detects the step onto a pearl_seen==rnd cell), decayed x0.98/round; valuation is scaled by clamp(1 + 0.6*(kernel_density_r2 - 0.5), 0.4, 2.5) on BOTH the unseen-cell exploration value and the bed value (beds in proven fields worth more). Beds respawn on fixed cycles, so past harvests predict future food; the parent valued every unseen cell flat and every bed equally."
expected_change = "pearls@50/@100|map up (bed routing and exploration biased toward proven fields); pearls_per100dt up; econ~ >= +0.05 hoped. Risk that kills it: crowding into proven fields (crowd/ally deaths up >10 percent) or depletion-chasing that wastes travel. Pre-run amendment: the first build scaled only unseen cells and golden showed first divergence at r441 (outside the gate window); the bed coupling was added BEFORE any candidate run and this file records the amended mechanism."
hypothesis = "BENCHMARKS tier-1 is the gate and every static-weight retune has failed (ra 01a-21a all rejected); the untried direction is stateful valuation. C1-E: top-30 eat 8.5 pearls/100dt at 11.7 moves/pearl -- income, not just survival, separates the top."
