author = "claude/ouroboros (s1)"
language = "c++"
lineage_parent = "hb1-04-deployable"
hypothesis = "hb1-04 (pure Heartbreaker mimic) has the fastest opening of any local bot (tempo -4.8 rounds vs hb1-12 on the seed-1 panel) but loses 35/120 panel games on the round-500 longest-dragon tiebreak (longest 12 vs opponent 24 on Portals/Slithery/Default/Schooltime while holding 196 total length). Handing over to the Ares V06 policy at round 250 keeps the opening and recovers the tiebreak."
mechanism = "One change vs hb1-04: the mimic runs only while round < 250 (World::sense is still called every mimic turn so Ares memory is warm); from round 250 the Ares V06 policy decides (split cut-off r380, crown growth)."
expected_change = "Tempo (r10-150) unchanged for R >= 150; win share up via length tiebreaks on the open maps; longest@499 up."
status = "experiment (not registered; inherits hb1-04's 28.6 MB model header, so it is not uploadable as is)"
