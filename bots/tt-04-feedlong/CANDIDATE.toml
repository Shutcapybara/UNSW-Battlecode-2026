hypothesis = "cheji bt converts by feeding the long dragon: after r330 a small dragon self-kills with a probability that rises steeply with the visible length of the ally beside it (6 % next to a length 1-2 ally, 45 % at 5-6, 82 % at 15+; 4 % with no ally in view). That concentrates material without an elected crown and leaves the rest of the swarm alive - unlike tt-01/tt-02 (whole swarm dissolved) and tt-03 (flat 3 %, no concentration)."
mechanism = "One block vs hb1-14: from r330, length <= 3, not the crown - nearest ally head within distance 3 and visibly longer -> self-kill with cheji bt's measured probability by that ally's visible length (adjacent: 0.06/0.24/0.45/0.57/0.74/0.82 for lengths <=2/3-4/5-6/7-9/10-14/15+; distance 2-3: 0.04/0.10/0.24/0.37/0.52/0.56), via the feeder's fatal-move routine. Ares crown/feeder logic unchanged."
expected_change = "Longest dragon at r400/r490 well above hb1-14 (9 / 27), fewer round-limit losses with a material lead, elimination wins kept."
