lineage_parent = "sparta-01-queen-priority"
hypothesis = "The queen's remaining wall deaths are partly caused by optimistic planning through unobserved edges. Rejecting such moves should improve queen survival without materially reducing team wins or economy."
mechanism = "Sparta 01 behavior plus an unknown-edge bit on simulated routes. Our original queen rejects a candidate route if any step crosses an unobserved edge, alongside the existing simulated-death, head-on, and visible enemy danger vetoes."
expected_change = "Fixed-seed paired screen, four maps, both seats, seeds 1–3: 12–12 vs Sparta 01 and 9–15 vs Carthage 05; queen alive@490 0/10 reached games against either opponent. Unknown-edge veto did not improve observed queen survival; retain only as a diagnostic control."
