hypothesis = "Match 658569 showed V28 splitting a length-4 pearl farmer into 2+2 one move before its final dead-end pearl; the two-segment parent then grew to length 3 and wall-died. When the best route is an under-room pearl farm, delaying all split choices through the last reachable pearl should preserve more length before producing the child."
mechanism = "Track the existing under-room pearl-farm condition on the best movement candidate. While that candidate targets a pearl or bed in the farm, prefer the move over routine, opening, or emergency splits; once the farm signal clears, V28's split policy resumes."
expected_change = "On dead-end feeding runs, collect the last reachable pearl before producing a tail child, avoid premature length-3 end deaths, and preserve V28 behavior outside pearl farms."
