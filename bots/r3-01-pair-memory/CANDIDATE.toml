expected_change = "Targeted row: near-portal deaths per 100 portal steps fall from 29.4 with wall+self near-portal deaths down, at unchanged transit volume (not a throttle: verified pairs cost nothing); pearls/100dt within 10%; BENCHMARKS gate on the rest."
