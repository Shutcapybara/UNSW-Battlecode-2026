           ["ACT:diss", 300, 500, 3], ["ACT:cert", 0, 500, 5], ["ACT:esc", 300, 500, 3],
           ["ACT:sw", 0, 500, 20]]

[local_evidence]
refs = ["docs/findings/sakura-s01-data/panel-both/results.jsonl (unswbc 1.2.2, --seed 1, 159 games)", "docs/findings/2026-09-28-sakura-s01-swarm-dissolve.md"]
summary = "DO NOT PROMOTE. Paired vs ouroboros-v10-beacon control on 139 fixtures (seed 1, ten live maps, both sides, 8-opponent pool): 9 better / 27 worse / 103 equal, net -18, sign-p 0.0039; prod-only -22 (p 0.0003), dissolve-only -15 (p 0.0275). H-prod half falsified (units_r100 median 18.5 ok; wall/self 5.2/1k > 5), H-dissolve falsified (longest_r400 3.0 vs target 18; recipient survival 100% holds), H-cert neutral (delivery verified, outcomes unmoved). Metered: max 63.8M, p99 48.3M, zero faults on both fixtures and both toolkits."
