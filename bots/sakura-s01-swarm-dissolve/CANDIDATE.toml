name = "sakura-s01-swarm-dissolve"
lineage = "sakura"
author = "glm/sakura/s01"
language = "python"
lineage_parent = "ouroboros-v10-beacon"
hypothesis = "A tail-heavy swarm to ~r100 plus adjacent, recipient-first dissolution from a map-conditioned onset raises longest at r400 against band opponents on the ten public maps."
mechanism = "SPLIT 2 production to a map-scaled cap (one dragon per 24 cells, floor 18); deterministic salvage (SPLIT L-2, trade, cheapest death); crown elected from r250 with staggered relayed beacons; L<=3 dragons dissolve adjacent to the crown from r300 (Portals / Slithery Fight signature) / r400 (others) with a recipient-eats-first precondition; birth certificate over the backward ray."
expected_change = "units_r100 >= 18; longest_r400 >= 18; wall_self_deaths_per_1k_turns <= 2; newborn_deaths_within_10_rounds down vs base; recipient survival >= 0.5."
priority = 300
supersedes = ""

