name = "ares-v40-length-priced-sprints"
lineage = "ares"
author = "codex/ares"
language = "c++"
lineage_parent = "ares-v37-near-portal-scout"
hypothesis = "V37's movement score charges an extra sprint cost after its simulator has already removed the consumed body segments; scoring the body delta once should value each extra move as one segment and treat an uncontested dash pearl as length-neutral with a small lost-future-growth cost."
mechanism = "Remove the duplicate per-step sprint cost from successful movement scoring and price H2H sprint moves at lv_now per extra step. Remove the generic eaten-pearl bonus; award one segment value only when a nearby enemy head is within two tiles of a collected pearl, and apply a 0.25 segment opportunity cost to a pearl collected after the first move when no enemy is nearby."
expected_change = "Discourage uncontested pearl dashes, retain dashes that deny an imminent pearl to an enemy, and make multi-step length cost scale one segment per extra move."
priority = 232
supersedes = ""

