hypothesis = "Knowing the ten public maps' terrain (atlas) plus portal-exit safety (solo probe ray, HOLD packet, own-body inference across portals) raises material and wins against band-class opponents on the ten public maps without moving any production or conversion clock."
mechanism = "On the first view the dragon loads the matching public map's terrain (atlas, unique first-view match; beds and pearls still learnt by sight). When the chosen move leaves the head next to a portal whose landing it cannot see, it casts one ray through that portal carrying a HOLD packet (next turn's echo prices the blind exit; an ally at the far exit treats the cell as held for 2 rounds). A partial own body is extended behind the head and, for a newborn, across the portal its rear passes through (61 of ~430 deaths in one Portals game were newborns stepping into their own unseen neck). Newborn neck linked by adjacency. Crown/beacon/feeding layer and every clock of the host unchanged. Economy (atlas beds, far target, pre-wait, contested sprints) and portal-exploration code is present but off."
expected_change = "vs fenrir-v18 on the 10 public maps: paired score >= +0.05; units_r100 +2; total_r250 +8; pearls per game up; portal-step deaths per game not up on Default/Schooltime (they rise on Portals because steps rise)."
