# tests pure economy/distribution/endgame transition; crossfire tests the
# contested-centre (devil) leak and portal-exit risk. Maps were frozen before
# any Serre screen/gauntlet outcome was read.
bots = ["../../bots/ouroboros-v13-ladder", "../../bots/leviathan-v09-arrival",
        "../../bots/avery-v08-crown-race", "../../bots/monte_christo-x12-remote-density"]
maps = ["reserve_maps"]
[run]
sides = ["A", "B"]
jobs = 4
timeout_seconds = 600
sandbox = false
control_every = 25
