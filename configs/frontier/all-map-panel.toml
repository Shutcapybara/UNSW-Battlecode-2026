# Bifröst V01 gained documentation after the pilot. The measured Git version
# eeedb73c90a5 and this checkout have identical package inputs and effective
# fingerprints; this alias lets the panel recognize that exact pilot source.
[source_aliases]
"037872088e6f5ac6660bca00197ac10322b155528f9ece23f4232759816e626a" = "b11a17e5fc4044e4664adc40933e91dbc85e9b8d93d30ac366b35105979e9a02"

[run]
sides = ["A", "B"]
jobs = 4
timeout_seconds = 600
sandbox = false
control_every = 10
